<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>AI 圆桌</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 第一层：输入框 + 右侧四宫格按钮（发送/设置，总结/历史） -->
  <header class="topbar">
    <div class="composer">
      <textarea id="prompt" rows="3"
        placeholder="输入问题，Ctrl+Enter 发送到勾选各家（Enter 换行）"></textarea>
      <div class="composer-actions">
        <button id="send-btn" title="发送到勾选各家（Ctrl+Enter）">发送</button>
        <button id="settings-btn" title="总结模型设置">设置</button>
        <button id="summarize-btn" class="primary" title="提交 LLM 总结" disabled>总结</button>
        <button id="history-btn" title="历史记录">历史</button>
      </div>
    </div>
  </header>

  <!-- 第二层：已选计数 + 各家按钮（点文字切换选中，点空白全屏打开） -->
  <nav id="model-bar">
    <div class="subset-ctrl">
      <span id="subset-count" class="subset-count">已选 8/8</span>
    </div>
    <div id="model-grid"></div>
  </nav>

  <!-- 第三层：输出层（左：各家回复；右：LLM 总结） -->
  <main id="output">
    <div class="progress-row">
      <span id="progress-text">尚未开始</span>
      <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>
    <div class="output-cols">
      <div id="rows"></div>
      <div id="divider" title="拖拽调整左右宽度"></div>
      <div id="summary-panel">
        <div class="summary-head">
          <span>📋 总结</span>
          <span id="summary-status" class="card-state"></span>
        </div>
        <div id="summary-body" class="summary-body placeholder">各家回答完毕后，点击「总结」。</div>
      </div>
    </div>
  </main>

  <!-- 各家 webview 面板：平时驻留在屏外 dock，点击按钮后切为全屏浮层 -->
  <div id="dock"></div>

  <!-- 设置弹窗 -->
  <div id="settings-modal" class="modal-mask" hidden>
    <div class="modal">
      <h2>总结模型设置（OpenAI 兼容 API）</h2>
      <label>Base URL
        <input id="cfg-baseurl" type="text" placeholder="https://api.deepseek.com/v1">
      </label>
      <label>API Key
        <input id="cfg-apikey" type="password" placeholder="sk-...">
      </label>
      <label>模型名
        <input id="cfg-model" type="text" placeholder="deepseek-chat">
      </label>
      <p class="modal-tip">配置仅保存在本机（localStorage），不会发送到任何网页。</p>
      <div class="modal-actions">
        <button id="cfg-save" class="primary">保存</button>
        <button id="cfg-cancel">取消</button>
      </div>
    </div>
  </div>

  <!-- 历史记录弹窗 -->
  <div id="history-modal" class="modal-mask" hidden>
    <div class="modal modal-wide">
      <h2>历史记录</h2>
      <div class="history-toolbar">
        <input id="history-search" type="text" placeholder="按问题关键词过滤…">
        <button id="history-refresh" class="icon-btn" title="刷新">⟳</button>
      </div>
      <div id="history-list" class="history-list"></div>
      <div id="history-detail" class="history-detail" hidden></div>
      <div class="modal-actions">
        <button id="history-back" hidden>← 返回列表</button>
        <button id="history-close">关闭</button>
      </div>
    </div>
  </div>

  <script src="../adapters.js"></script>
  <script src="app.js"></script>
</body>
</html>
